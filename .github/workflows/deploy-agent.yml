name: Deploy read-only IAM agent

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the deployment configuration
        required: true
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-iam-agent-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Validate and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'iam-agent' }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      BIGQUERY_PROJECT: ${{ vars.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
      QUERY_MAX_ROWS: ${{ vars.QUERY_MAX_ROWS || '500' }}
      QUERY_MAX_BYTES_BILLED: ${{ vars.QUERY_MAX_BYTES_BILLED || '500000000' }}
      QUERY_MAX_STEPS: ${{ vars.QUERY_MAX_STEPS || '6' }}
      WEB_GOOGLE_CLIENT_ID: ${{ vars.WEB_GOOGLE_CLIENT_ID }}
      WEB_ANALYST_PRINCIPALS: ${{ vars.WEB_ANALYST_PRINCIPALS }}
      CHAT_ANALYST_PRINCIPALS: ${{ vars.CHAT_ANALYST_PRINCIPALS }}
      QUERY_DEFAULT_SCOPE: ${{ vars.QUERY_DEFAULT_SCOPE || '/company' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline validation
        run: |
          python -m compileall -q iam_agent iam_mcp main.py
          ruff check iam_agent iam_mcp tests main.py
          python -m pytest -q

      - name: Validate GitHub Environment variables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            WIF_PROVIDER
            DEPLOY_SERVICE_ACCOUNT
            RUNTIME_SERVICE_ACCOUNT
            BIGQUERY_PROJECT
            BIGQUERY_DATASET
            WEB_GOOGLE_CLIENT_ID
            WEB_ANALYST_PRINCIPALS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Set ${name} in the '${{ inputs.environment }}' GitHub Environment."
              exit 1
            fi
          done

          if [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::GCP_PROJECT_ID is not a valid Google Cloud project ID."
            exit 1
          fi
          if [[ ! "${BIGQUERY_DATASET}" =~ ^[A-Za-z_][A-Za-z0-9_]{0,1023}$ ]]; then
            echo "::error::BIGQUERY_DATASET must contain only letters, digits, and underscores."
            exit 1
          fi
          for name in QUERY_MAX_ROWS QUERY_MAX_BYTES_BILLED QUERY_MAX_STEPS; do
            if [[ ! "${!name}" =~ ^[0-9]+$ ]] || (( ${!name} < 1 )); then
              echo "::error::${name} must be a positive integer."
              exit 1
            fi
          done
          if (( QUERY_MAX_ROWS > 5000 )); then
            echo "::error::QUERY_MAX_ROWS cannot exceed the application limit of 5000."
            exit 1
          fi
          if (( QUERY_MAX_STEPS > 8 )); then
            echo "::error::QUERY_MAX_STEPS cannot exceed the application limit of 8."
            exit 1
          fi
          if [[ ! "${WEB_GOOGLE_CLIENT_ID}" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::WEB_GOOGLE_CLIENT_ID must be a Google OAuth web client ID."
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Check runtime service account
        shell: bash
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "${RUNTIME_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(email)'

      - name: Deploy Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source=. \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --execution-environment=gen2 \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=10 \
            --timeout=300 \
            --min=0 \
            --max=1 \
            --no-allow-unauthenticated \
            --set-env-vars="^|^GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}|GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}|GEMINI_MODEL=${GEMINI_MODEL}|BIGQUERY_PROJECT=${BIGQUERY_PROJECT}|BIGQUERY_DATASET=${BIGQUERY_DATASET}|QUERY_MAX_ROWS=${QUERY_MAX_ROWS}|QUERY_MAX_BYTES_BILLED=${QUERY_MAX_BYTES_BILLED}|QUERY_MAX_STEPS=${QUERY_MAX_STEPS}|VERIFY_GOOGLE_CHAT_TOKEN=true|GOOGLE_CHAT_AUDIENCE=https://pending.invalid/google-chat/events|ENABLE_WEB_UI=true|WEB_GOOGLE_CLIENT_ID=${WEB_GOOGLE_CLIENT_ID}|WEB_ANALYST_PRINCIPALS=${WEB_ANALYST_PRINCIPALS}|CHAT_ANALYST_PRINCIPALS=${CHAT_ANALYST_PRINCIPALS}|QUERY_DEFAULT_SCOPE=${QUERY_DEFAULT_SCOPE}" \
            --quiet

      - name: Configure verified public endpoints
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"

          # The page is public so it can load before Google sign-in. Every message
          # is authenticated in FastAPI with a Google ID token or Chat OIDC token.
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="GOOGLE_CHAT_AUDIENCE=${service_url}/google-chat/events" \
            --no-invoker-iam-check \
            --quiet

      - name: Show endpoints and next steps
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          {
            echo "## Read-only IAM agent deployed"
            echo
            echo "Web interface: ${service_url}"
            echo
            echo "Health check: ${service_url}/healthz"
            echo
            echo "Optional Google Chat endpoint: ${service_url}/google-chat/events"
            echo
            echo "No Cloud SQL instance or database secret is used by this version."
          } >> "${GITHUB_STEP_SUMMARY}"
